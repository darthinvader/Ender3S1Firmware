name: configurator

# Serverless build of one selection: apply it to the pinned tree, compile it,
# verify the ARM vector table, and publish build-<hash> as a release so the
# image downloads without an account. Called directly (workflow_dispatch) or by
# build-request.yml when a visitor asks for a selection from the site.
on:
  workflow_dispatch:
    inputs:
      machine:
        description: Machine preset id
        default: ender3s1-f103
        required: true
      disable:
        description: Comma separated feature ids to turn OFF (see tools/configurator/features.json)
        default: ''
        required: false
      mesh:
        description: Default bed mesh size per axis (3..9, empty = catalogue default)
        default: ''
        required: false
      enable:
        description: Comma separated feature ids to turn ON (off by default)
        default: ''
        required: false
  workflow_call:
    inputs:
      machine:
        type: string
        default: ender3s1-f103
        required: false
      disable:
        type: string
        default: ''
        required: false
      mesh:
        type: string
        default: ''
        required: false
      enable:
        type: string
        default: ''
        required: false
    outputs:
      tag:
        description: The release tag this selection was published as
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: write

jobs:
  build:
    name: configurator build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap the pinned sources
        run: ./scripts/bootstrap.sh

      - name: Apply the selection
        env:
          MACHINE: ${{ inputs.machine }}
          DISABLE: ${{ inputs.disable }}
          MESH: ${{ inputs.mesh }}
          ENABLE: ${{ inputs.enable }}
        run: |
          python3 - <<'PY'
          import json, os
          off = [x.strip() for x in os.environ.get('DISABLE', '').split(',') if x.strip()]
          on = [x.strip() for x in os.environ.get('ENABLE', '').split(',') if x.strip()]
          sel = {'machine': os.environ.get('MACHINE', 'ender3s1-f103'), 'on': on, 'off': off}
          open('/tmp/selection.json', 'w').write(json.dumps(sel))
          print(json.dumps(sel))
          PY
          if [ -n "$MESH" ]; then
            python3 tools/configurator/apply_features.py \
              --catalog tools/configurator/features.json \
              --tree build/Ender3V2S1 \
              --config-dir configs/Ender3S1-F1-v2 \
              --selection @/tmp/selection.json \
              --out build/configurator/meta.json \
              --mesh "$MESH"
          else
            python3 tools/configurator/apply_features.py \
              --catalog tools/configurator/features.json \
              --tree build/Ender3V2S1 \
              --config-dir configs/Ender3S1-F1-v2 \
              --selection @/tmp/selection.json \
              --out build/configurator/meta.json
          fi

      - name: Compile
        run: ./scripts/build.sh | tee build/configurator/build.log

      - name: Verify the image
        run: |
          BIN=$(ls -1t build/out/*.bin | head -n 1)
          python3 scripts/check-vector-table.py "$BIN"
          sha256sum "$BIN"
          cp "$BIN" build/configurator/firmware.bin

      - name: Upload firmware and manifest
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/configurator/firmware.bin
            build/configurator/meta.json
            build/configurator/build.log
          if-no-files-found: error

      - name: Publish this exact selection as a release (public download, no account)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MACHINE: ${{ inputs.machine }}
          DISABLE: ${{ inputs.disable }}
          MESH: ${{ inputs.mesh }}
          ENABLE: ${{ inputs.enable }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sel="machine=$MACHINE;off=$DISABLE;mesh=$MESH"
          if [ -n "$ENABLE" ]; then sel="$sel;on=$ENABLE"; fi
          HASH=$(printf '%s' "$sel" | sha256sum | cut -c1-12)
          TAG="build-$HASH"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/firmware.bin"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "this selection is already published as $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" \
              build/configurator/firmware.bin \
              build/configurator/meta.json \
              build/configurator/build.log \
              --title "Build $HASH - $MACHINE" \
              --notes "Selection: $sel
          Built by workflow run $RUN_ID from commit $SHA.
          The image was verified with scripts/check-vector-table.py before publishing."
            echo "published $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**download:** $URL" >> "$GITHUB_STEP_SUMMARY"

