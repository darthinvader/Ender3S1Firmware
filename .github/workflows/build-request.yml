name: build request

# A visitor cannot dispatch a workflow (that needs write access), so the site
# asks them to open an issue with a machine-readable body. This validates it
# strictly, builds it with the same reusable workflow, and answers in the issue.
# No server, no token on a public page, no payment method anywhere.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  validate:
    name: validate the request
    if: "startsWith(github.event.issue.title, 'build: ')"
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.parse.outputs.ok }}
      machine: ${{ steps.parse.outputs.machine }}
      disable: ${{ steps.parse.outputs.disable }}
      enable: ${{ steps.parse.outputs.enable }}
      mesh: ${{ steps.parse.outputs.mesh }}
      hash: ${{ steps.parse.outputs.hash }}
      unknown: ${{ steps.parse.outputs.unknown }}
    steps:
      - name: Parse and validate
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys
          body = os.environ.get("ISSUE_BODY") or ""
          ok = "false"
          machine = disable = enable = mesh = hash12 = unknown = ""
          import urllib.request
          try:
              catalog = json.load(urllib.request.urlopen(
                  "https://raw.githubusercontent.com/" + os.environ.get("REPO", "") +
                  "/main/tools/configurator/features.json", timeout=25))
              known = {f["id"] for f in catalog.get("features", []) if f.get("buildable", True)}
          except Exception as exc:
              print("catalogue unavailable:", exc, file=sys.stderr)
              known = None
          unknown = ""
          start = body.find("{", body.find("json"))
          end = body.rfind("}")
          if start != -1 and end > start:
              try:
                  sel = json.loads(body[start:end + 1])
                  machine = str(sel.get("machine", "ender3s1-f103"))
                  off = sel.get("off") or []
                  on = sel.get("on") or []
                  step = sel.get("mesh")
                  good = (
                      machine == "ender3s1-f103"
                      and isinstance(off, list) and len(off) <= 120
                      and all(isinstance(x, str) and x.replace("_", "").isalnum()
                              and 2 <= len(x) <= 48 for x in off)
                      and isinstance(on, list) and len(on) <= 120
                      and all(isinstance(x, str) and x.replace("_", "").isalnum()
                              and 2 <= len(x) <= 48 for x in on)
                      and step in [None, "", 3, 5, 7, 9]
                  )
                  if good:
                      off = sorted(set(off))
                      on = sorted(set(on))
                      disable = ",".join(off)
                      enable = ",".join(on)
                      mesh = "" if step in (None, "") else str(step)
                      line = "machine=%s;off=%s;mesh=%s" % (machine, disable, mesh)
                      if enable:
                          line += ";on=" + enable
                      hash12 = hashlib.sha256(line.encode()).hexdigest()[:12]
                      if known is not None:
                          bad = [x for x in (off + on) if x not in known]
                          if bad:
                              unknown = ",".join(bad[:6])
                          else:
                              ok = "true"
                      else:
                          ok = "true"
              except Exception as exc:
                  print("parse failed:", exc, file=sys.stderr)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in (("ok", ok), ("machine", machine), ("disable", disable),
                                 ("enable", enable), ("mesh", mesh), ("hash", hash12),
                                 ("unknown", unknown)):
                  out.write(key + "=" + value + "\n")
          print("accepted" if ok == "true" else "rejected", machine, disable, mesh, hash12)
          PY

  build:
    name: build it
    needs: validate
    if: needs.validate.outputs.ok == 'true'
    uses: ./.github/workflows/configurator.yml
    permissions:
      contents: write
    with:
      machine: ${{ needs.validate.outputs.machine }}
      disable: ${{ needs.validate.outputs.disable }}
      enable: ${{ needs.validate.outputs.enable }}
      mesh: ${{ needs.validate.outputs.mesh }}

  answer:
    name: answer in the issue
    needs: [validate, build]
    if: always() && needs.validate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment the link and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          UNKNOWN: ${{ needs.validate.outputs.unknown }}
          TAG: ${{ needs.build.outputs.tag }}
          HASH: ${{ needs.validate.outputs.hash }}
          SEL_MACHINE: ${{ needs.validate.outputs.machine }}
          SEL_DISABLE: ${{ needs.validate.outputs.disable }}
          SEL_ENABLE: ${{ needs.validate.outputs.enable }}
          SEL_MESH: ${{ needs.validate.outputs.mesh }}
          BUILD_RESULT: ${{ needs.build.result }}
          EXISTED: ${{ needs.build.outputs.existed }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ] || { [ "$BUILD_RESULT" != "success" ] && [ "$EXISTED" != "true" ]; }; then
            printf 'The build for %s failed.\n\n' "$HASH" > /tmp/comment.md
            printf 'The run is here: %s/%s/actions/runs/%s\n\n' "$SERVER" "$REPO" "$RUN_ID" >> /tmp/comment.md
            printf 'The usual cause is a selection that does not fit the 233,472 B region: the budget check stops before the compiler, and the log names the overflow in bytes. Switch a feature off and ask again.\n' >> /tmp/comment.md
            gh issue comment "$NUMBER" --repo "$REPO" --body-file /tmp/comment.md
            gh issue close "$NUMBER" --repo "$REPO" --reason "not planned"
            exit 0
          fi
          URL="https://github.com/$REPO/releases/download/$TAG/firmware.bin"
          DISABLE_TEXT="$SEL_DISABLE"; [ -z "$DISABLE_TEXT" ] && DISABLE_TEXT="none"
          ENABLE_TEXT="$SEL_ENABLE"; [ -z "$ENABLE_TEXT" ] && ENABLE_TEXT="none"
          MESH_TEXT="$SEL_MESH"; [ -z "$MESH_TEXT" ] && MESH_TEXT="catalogue default"
          {
            if [ "$EXISTED" = "true" ]; then
              printf 'This exact selection was already built and published: %s\n\n' "$TAG"
            else
              printf 'Built and published as a release: %s\n\n' "$TAG"
            fi
            printf '**download:** %s\n\n' "$URL"
            printf '| selection | value |\n|---|---|\n'
            printf '| machine | %s |\n' "$SEL_MACHINE"
            printf '| features disabled | %s |\n' "$DISABLE_TEXT"
            printf '| features enabled | %s |\n' "$ENABLE_TEXT"
            printf '| mesh default | %s |\n' "$MESH_TEXT"
            printf '\nThe image was verified with check-vector-table before it was published.\n'
          } > /tmp/comment.md
          gh issue comment "$NUMBER" --repo "$REPO" --body-file /tmp/comment.md
          gh issue close "$NUMBER" --repo "$REPO" --reason "completed"

  reject:
    name: explain a bad request
    needs: validate
    if: needs.validate.outputs.ok != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Say what was wrong
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -n "$UNKNOWN" ]; then
            printf 'This request names feature ids that are not in the catalogue: %s\n\n' "$UNKNOWN" > /tmp/comment.md
            printf 'Open the build page again and pick from the list; the ids there are the ones the catalogue accepts.\n' >> /tmp/comment.md
          else
            printf 'This issue does not contain a valid build request. The site opens it with a JSON block in the body; a request names the machine, the feature ids to disable and an optional mesh size of 3, 5, 7 or 9.\n' > /tmp/comment.md
          fi
          gh issue comment "$NUMBER" --repo "$REPO" --body-file /tmp/comment.md || true
          gh issue close "$NUMBER" --repo "$REPO" --reason "not planned" || true

