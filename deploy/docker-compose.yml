services:
  configurator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ender3s1-configurator:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - build-tree:/app/build
    environment:
      CONFIGURATOR_PORT: "8787"
      SKIP_BOOTSTRAP: "0"

volumes:
  build-tree:
