[printer]
name                = Ender3S1          ; bed 220x220, Sprite direct drive
board               = 301F1             ; BOARD_CREALITY_V24S1_301, env STM32F103RC_creality (F103, 256KB)
probe               = BLT               ; CR Touch on BLTouch port
leveling            = UBL               ; AUTO_BED_LEVELING_UBL
display             = DACAI             ; stock S1 color screen
thermistor          = T1                ; TEMP_SENSOR_0 1
features            = IS, LA, MPC, BFT
custom_machine_name = Ender3S1-F1-v2    ; Configuration.h:135, Version.h:40

[v2_changes]
