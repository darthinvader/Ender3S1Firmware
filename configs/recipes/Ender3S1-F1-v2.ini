[source_patch]
; One SOURCE fix was required in the mriscoc tree (not a config option):
;   Ender3V2S1/Marlin/src/lcd/dwin/proui/dwinui.h:158
;   + #define ICON_ShapingZ  CI(1,ICON_MoveZ)
; Upstream bug: dwin.cpp:2863-2864 references ICON_ShapingZ in drawInputShaping_menu()
; when INPUT_SHAPING_Z + SHAPING_MENU are on, but dwinui.h only defined X/Y aliases.
; Patch mirrors the existing ICON_ShapingX/Y pattern. Keep this line when pulling
; future mriscoc updates (or verify upstream fixed it).

