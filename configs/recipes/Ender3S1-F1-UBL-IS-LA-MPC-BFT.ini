; Professional Firmware (mriscoc) Configurator input
; Equivalent to Special_Configurations/Configurator.pyw GUI selections.
; Applied via:  cd Special_Configurations && python3 -c \
;   "import CreateConfigs; CreateConfigs.Generate('Ender3S1-F1-UBL-IS-LA-MPC-BFT', \
;    ['Ender3S1','301F1','BLT','UBL','DACAI','T1','IS','LA','MPC','BFT'])"
;
; Configurator versions: Configurator.pyw v4.2 / CreateConfigs.py v6.2
; Special_Configurations HEAD: 2026-01-10, Ender3V2S1 HEAD: 2026-06-05

[printer]
name          = Ender3S1          ; _printers/Ender3S1.json (bed 220x220, Sprite direct drive)

[board]
name          = 301F1             ; _boards/301F1.json -> BOARD_CREALITY_V24S1_301, env STM32F103RC_creality (F103, 256KB)

[leveling]
probe         = BLT               ; _leveling/BLT.json (CR Touch on BLTouch port, Z_SAFE_HOMING)
ubl           = true              ; _leveling/UBL.json (AUTO_BED_LEVELING_UBL, OPTIMIZED_MESH_STORAGE)

[display]
name          = DACAI             ; _displays/DACAI.json (#define DACAI_DISPLAY, stock S1 color screen)

[thermistor]
name          = T1                ; _thermistor/T1.json -> TEMP_SENSOR_0 1 (stock Sprite, NOT 13)

[features]
list          = IS, LA, MPC, BFT  ; _features/{IS,LA,MPC}.json + custom _features/BFT.json
IS            = true              ; INPUT_SHAPING_X + INPUT_SHAPING_Y + SHAPING_MENU (M593)
LA            = true              ; LIN_ADVANCE (M900 K), ADVANCE_K 0.0; keeps JD, disables S_CURVE (mriscoc default)
MPC           = true              ; MPCTEMP + MPC_AUTOTUNE/_MENU replaces PIDTEMP
BFT           = true              ; custom json: re-enables BINARY_FILE_TRANSFER + CUSTOM_FIRMWARE_UPLOAD
                                  ; (301F1.json disables BFT for flash space; BFT.json applied last undoes that)

[notes]
junction_deviation = CLASSIC_JERK disabled, JUNCTION_DEVIATION_MM 0.1 (mriscoc default, not forced)
custom_machine_name = Ender3S1-F1-UBL-IS-LA-MPC-BFT
